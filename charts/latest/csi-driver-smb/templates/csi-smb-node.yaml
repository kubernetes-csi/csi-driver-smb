{{- if .Values.linux.enabled}}
{{- /*
  The driver uses the kerberos cache directory at the same path as the node, so
  that the symlinks it writes and cifs.upcall of the node agree. A directory
  inside the kubelet directory is seen through the kubelet mount; mounting it
  again there, under the bidirectional kubelet mount, would propagate to the
  node and stack a bind mount on every start of the pod.
*/}}
{{- $krb5Dir := .Values.linux.krb5CacheDirectory | trimSuffix "/" }}
{{- $krb5InKubelet := hasPrefix (printf "%s/" (.Values.linux.kubelet | trimSuffix "/")) (printf "%s/" $krb5Dir) }}
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: {{ .Values.linux.dsName }}
  namespace: {{ .Release.Namespace }}
{{ include "smb.labels" . | indent 2 }}
spec:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: {{ .Values.node.maxUnavailable }}
    type: RollingUpdate
  selector:
    matchLabels:
      app: {{ .Values.linux.dsName }}
  template:
    metadata:
{{ include "smb.labels" . | indent 6 }}
        app: {{ .Values.linux.dsName }}
        {{- if .Values.podLabels }}
{{- toYaml .Values.podLabels | nindent 8 }}
        {{- end }}
{{- if or .Values.podAnnotations (ne .Values.linux.krb5Conf "") }}
      annotations:
{{- if ne .Values.linux.krb5Conf "" }}
        checksum/krb5-conf: {{ .Values.linux.krb5Conf | sha256sum }}
{{- end }}
{{- if .Values.podAnnotations }}
{{ toYaml .Values.podAnnotations | indent 8 }}
{{- end }}
{{- end }}
    spec:
{{- with .Values.node.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}    
      hostNetwork: true
      dnsPolicy: {{ .Values.linux.dnsPolicy }}
      serviceAccountName: {{ .Values.serviceAccount.node }}
      nodeSelector:
        kubernetes.io/os: linux
{{- with .Values.node.nodeSelector }}
{{ toYaml . | indent 8 }}
{{- end }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- if .Values.securityContext }}
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      {{- end }}
{{- with .Values.linux.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}
      {{- include "smb.pullSecrets" . | indent 6 }}
{{- if and (ne .Values.linux.krb5CacheDirectory "") .Values.linux.krb5AutoConfig }}
      initContainers:
        - name: setup-krb5-ccache
{{- if hasPrefix "/" .Values.image.smb.repository }}
          image: "{{ .Values.image.baseRepo }}{{ .Values.image.smb.repository }}:{{ .Values.image.smb.tag }}"
{{- else }}
          image: "{{ .Values.image.smb.repository }}:{{ .Values.image.smb.tag }}"
{{- end }}
          imagePullPolicy: {{ .Values.image.smb.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /host/etc/krb5.conf.d
              prefix="{{ .Values.linux.krb5Prefix | default "krb5cc_" }}"
              cachedir="{{ .Values.linux.krb5CacheDirectory | trimSuffix "/" }}"
              cat > /host/etc/krb5.conf.d/90-csi-driver-smb.conf <<EOF
              [libdefaults]
                  default_ccache_name = FILE:${cachedir}/${prefix}%{uid}
              EOF
{{- if ne .Values.linux.krb5Conf "" }}
              cat /krb5-custom/custom.conf > /host/etc/krb5.conf.d/91-csi-driver-smb-custom.conf
{{- else }}
              rm -f /host/etc/krb5.conf.d/91-csi-driver-smb-custom.conf
{{- end }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: krb5-confd
              mountPath: /host/etc/krb5.conf.d
{{- if ne .Values.linux.krb5Conf "" }}
            - name: krb5-custom-conf
              mountPath: /krb5-custom
              readOnly: true
{{- end }}
          resources: {{- toYaml .Values.linux.resources.livenessProbe | nindent 12 }}
{{- end }}
      containers:
        - name: liveness-probe
          volumeMounts:
            - mountPath: /csi
              name: socket-dir
{{- if hasPrefix "/" .Values.image.livenessProbe.repository }}
          image: "{{ .Values.image.baseRepo }}{{ .Values.image.livenessProbe.repository }}:{{ .Values.image.livenessProbe.tag }}"
{{- else }}
          image: "{{ .Values.image.livenessProbe.repository }}:{{ .Values.image.livenessProbe.tag }}"
{{- end }}
          args:
            - --csi-address=/csi/csi.sock
            - --probe-timeout=3s
            - --http-endpoint=127.0.0.1:{{ .Values.node.livenessProbe.healthPort }}
            - --v=2
          imagePullPolicy: {{ .Values.image.livenessProbe.pullPolicy }}
          resources: {{- toYaml .Values.linux.resources.livenessProbe | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
        - name: node-driver-registrar
{{- if hasPrefix "/" .Values.image.nodeDriverRegistrar.repository }}
          image: "{{ .Values.image.baseRepo }}{{ .Values.image.nodeDriverRegistrar.repository }}:{{ .Values.image.nodeDriverRegistrar.tag }}"
{{- else }}
          image: "{{ .Values.image.nodeDriverRegistrar.repository }}:{{ .Values.image.nodeDriverRegistrar.tag }}"
{{- end }}
          args:
            - --csi-address=$(ADDRESS)
            - --kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)
            - --v=2
{{- if .Values.node.nodeDriverRegistrar.livenessProbe.enabled }}
            - --http-endpoint=localhost:{{ .Values.node.nodeDriverRegistrar.healthPort }}
{{- end }}
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: {{ .Values.linux.kubelet }}/plugins/{{ .Values.driver.name }}/csi.sock
          imagePullPolicy: {{ .Values.image.nodeDriverRegistrar.pullPolicy }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
          resources: {{- toYaml .Values.linux.resources.nodeDriverRegistrar | nindent 12 }}
{{- if .Values.node.nodeDriverRegistrar.livenessProbe.enabled }}
          ports:
            - name: healthz
              containerPort: {{ .Values.node.nodeDriverRegistrar.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              host: localhost
              path: /healthz
              port: healthz
            initialDelaySeconds: {{ .Values.node.nodeDriverRegistrar.livenessProbe.initialDelaySeconds }}
            timeoutSeconds: {{ .Values.node.nodeDriverRegistrar.livenessProbe.timeoutSeconds }}
            periodSeconds: {{ .Values.node.nodeDriverRegistrar.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.node.nodeDriverRegistrar.livenessProbe.failureThreshold }}
{{- end }}
          securityContext:
            capabilities:
              drop:
              - ALL
        - name: smb
{{- if hasPrefix "/" .Values.image.smb.repository }}
          image: "{{ .Values.image.baseRepo }}{{ .Values.image.smb.repository }}:{{ .Values.image.smb.tag }}"
{{- else }}
          image: "{{ .Values.image.smb.repository }}:{{ .Values.image.smb.tag }}"
{{- end }}
          imagePullPolicy: {{ .Values.image.smb.pullPolicy }}
          args:
            - "--v={{ .Values.node.logLevel }}"
            - "--drivername={{ .Values.driver.name }}"
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--nodeid=$(KUBE_NODE_NAME)"
            - "--enable-get-volume-stats={{ .Values.feature.enableGetVolumeStats }}"
            - "--krb5-prefix={{ .Values.linux.krb5Prefix }}"
{{- if ne $krb5Dir "" }}
            - "--krb5-cache-directory={{ $krb5Dir }}/"
{{- end }}
            - "--krb5-ensure-passwd-entry={{ .Values.linux.krb5EnsurePasswdEntry }}"
            - "--krb5-renew-interval={{ .Values.linux.krb5RenewInterval }}"
{{- if .Values.linux.krb5HostUserdb }}
            - "--krb5-host-userdb-directory=/host/run/userdb"
{{- end }}
{{- if .Values.node.metricsPort }}
            - "--metrics-address=0.0.0.0:{{ .Values.node.metricsPort }}"
          ports:
            - containerPort: {{ .Values.node.metricsPort }}
              name: metrics
              protocol: TCP
{{- end }}
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /healthz
              port: {{ .Values.node.livenessProbe.healthPort }}
            initialDelaySeconds: 30
            timeoutSeconds: 10
            periodSeconds: 30
          env:
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            capabilities:
              drop:
              - ALL
          volumeMounts:
            - mountPath: /csi
              name: socket-dir
            - mountPath: {{ .Values.linux.kubelet }}
              mountPropagation: Bidirectional
              name: mountpoint-dir
{{- if ne $krb5Dir "" }}
{{- if $krb5InKubelet }}
            # only for kubelet to create the directory, the driver uses it through the kubelet mount
            - mountPath: /krb5-cache-directory
              name: krb5cache-dir
              readOnly: true
{{- else }}
            - mountPath: {{ $krb5Dir }}/
              name: krb5cache-dir
{{- end }}
{{- end }}
{{- if or (ne .Values.linux.krb5Conf "") (ne $krb5Dir "") }}
            - mountPath: /etc/krb5.conf.d
              name: krb5-custom-conf
              readOnly: true
{{- end }}
{{- if .Values.linux.krb5HostUserdb }}
            - mountPath: /host/run/userdb
              name: host-userdb
{{- end }}
          resources: {{- toYaml .Values.linux.resources.smb | nindent 12 }}
      volumes:
        - hostPath:
            path: {{ .Values.linux.kubelet }}/plugins/{{ .Values.driver.name }}
            type: DirectoryOrCreate
          name: socket-dir
        - hostPath:
            path: {{ .Values.linux.kubelet }}/
            type: DirectoryOrCreate
          name: mountpoint-dir
        - hostPath:
            path: {{ .Values.linux.kubelet }}/plugins_registry/
            type: DirectoryOrCreate
          name: registration-dir
{{- if ne .Values.linux.krb5CacheDirectory "" }}
        - hostPath:
            path: {{ .Values.linux.krb5CacheDirectory }}
            type: DirectoryOrCreate
          name: krb5cache-dir
{{- end }}
{{- if and (ne .Values.linux.krb5CacheDirectory "") .Values.linux.krb5AutoConfig }}
        - hostPath:
            path: /etc/krb5.conf.d
            type: DirectoryOrCreate
          name: krb5-confd
{{- end }}
{{- if or (ne .Values.linux.krb5Conf "") (ne $krb5Dir "") }}
        - configMap:
            name: {{ .Values.linux.dsName }}-krb5-conf
          name: krb5-custom-conf
{{- end }}
{{- if .Values.linux.krb5HostUserdb }}
        - hostPath:
            path: /run/userdb
            type: DirectoryOrCreate
          name: host-userdb
{{- end }}
{{- end -}}

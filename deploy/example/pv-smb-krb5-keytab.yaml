---
# kubectl create secret generic smbcreds-krb5 \
#   --from-literal krb5keytab=$(base64 -w 0 user.keytab) \
#   --from-literal krb5principal=USERNAME@EXAMPLE.COM
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    pv.kubernetes.io/provisioned-by: smb.csi.k8s.io
  name: pv-smb-krb5-keytab
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: smb
  mountOptions:
    # no cruid: the driver picks a credential uid per principal
    - sec=krb5i
    - vers=3.0
    - dir_mode=0777
    - file_mode=0777
    - noserverino  # required to prevent data corruption
  csi:
    driver: smb.csi.k8s.io
    # volumeHandle format: {smb-server-address}#{sub-dir-name}#{share-name}
    # make sure this value is unique for every share in the cluster
    volumeHandle: smb-server.default.svc.cluster.local/share##krb5
    volumeAttributes:
      source: //smb-server.default.svc.cluster.local/share
    nodeStageSecretRef:
      name: smbcreds-krb5
      namespace: default
